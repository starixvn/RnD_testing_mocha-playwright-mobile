image: 
  name: git3.nexdev.net:5050/rnd/testing/qc-auto-image:master

stages: 
  - test

test1:
  stage: test
  tags:
    - docker-automation-test
  script:
    - echo $CI_PIPELINE_ID
    - npm install --no-optional
    - npm run CI_SelGame_$MODE --args=env=$ENV --game=$PRODUCT
  after_script:
    - echo "Execute this command after the `script` section completes."  
    - npm run sendResultToTelegram --args=Job=$CI_PIPELINE_ID-env=$ENV --mode=$MODE
  artifacts:
    paths:
      - Report
    when: always
    expire_in: 1 day 

